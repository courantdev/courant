name: ci

# Every push and pull request: ruff, and the test suite (offline: no Docker, no solver, no model
# call, no secret). Nothing here publishes anything. Every action is pinned to a commit, and
# every package is installed from a lock with --require-hashes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes --no-deps -r packaging/requirements-dev.lock
      # pyflakes and syntax errors; style is not linted.
      - name: ruff
        run: ruff check --select F,E9 courant tests scripts

  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (every file checked by hash)
        run: |
          pip install --require-hashes -r packaging/requirements-release.lock -r packaging/requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Tests
        run: python -m pytest -q -m "not slow"

  lock:
    name: the release lock installs with its hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install the release lock, then courant without dependencies
        run: |
          pip install --require-hashes -r packaging/requirements-release.lock
          pip install --no-deps --no-build-isolation -e .
          courant version
          courant verify --about
